[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tgdrive"
version = "0.1.0"
description = "基于 Telegram Bot 的加密分片对象存储"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=45",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
tgdrive = "tgdrive.app:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tgdrive*"]
