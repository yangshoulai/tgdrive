[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "tgdrive"
version = "1.37.3"
description = "基于 Telegram Bot 的加密分片对象存储"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "cryptography>=45",
  "uvicorn>=0.30",
  "webauthn==3.0.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.8"]
platform = ["yt-dlp==2026.8.19", "yt-dlp-ejs==0.8.0", "gallery-dl==1.32.16"]

[project.scripts]
tgdrive = "tgdrive.app:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tgdrive*"]
