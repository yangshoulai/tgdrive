services:
  tgdrive:
    build:
      context: .
    image: ghcr.io/yangshoulai/tgdrive:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      TGDRIVE_DATA_DIR: /data
      TGDRIVE_HOST: 0.0.0.0
      TGDRIVE_PORT: 8000
      # 本地直接用 HTTP 访问时需要关闭 Secure Cookie；生产环境请删除此项并使用 HTTPS。
      TGDRIVE_INSECURE_COOKIES: "1"
    volumes:
      - tgdrive-data:/data

volumes:
  tgdrive-data:
