services:
  tgdrive:
    build:
      context: .
    image: ghcr.io/yangshoulai/tgdrive:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      TGDRIVE_DATA_DIR: /data
      TGDRIVE_HOST: 0.0.0.0
      TGDRIVE_PORT: 8000
      # 反向代理与容器不在同一网段时填写，例如 172.20.0.0/16。
      # TGDRIVE_TRUSTED_PROXIES: 172.20.0.0/16
    volumes:
      - tgdrive-data:/data

volumes:
  tgdrive-data:
