name: 构建并发布 Docker 镜像

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 校验标签与版本号一致
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 pyproject.toml 中的版本 $version 不一致，请先更新版本号"
            exit 1
          fi

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装后端依赖
        run: python -m pip install .

      - name: 检查并构建前端
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与 OCI 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 生成带 FFmpeg 的镜像标签
        id: meta-ffmpeg
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag,suffix=-ffmpeg
            type=semver,pattern={{version}},suffix=-ffmpeg
            type=semver,pattern={{major}}.{{minor}},suffix=-ffmpeg
            type=semver,pattern={{major}},suffix=-ffmpeg,enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest-ffmpeg

      - name: 构建并推送带 FFmpeg 的镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: INSTALL_FFMPEG=1
          tags: ${{ steps.meta-ffmpeg.outputs.tags }}
          labels: ${{ steps.meta-ffmpeg.outputs.labels }}
          cache-from: type=gha,scope=ffmpeg
          cache-to: type=gha,scope=ffmpeg,mode=max

      - name: 生成平台下载镜像标签
        id: meta-platform
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag,suffix=-platform
            type=semver,pattern={{version}},suffix=-platform
            type=semver,pattern={{major}}.{{minor}},suffix=-platform
            type=semver,pattern={{major}},suffix=-platform,enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest-platform

      - name: 构建并推送平台下载镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          target: platform
          push: true
          tags: ${{ steps.meta-platform.outputs.tags }}
          labels: ${{ steps.meta-platform.outputs.labels }}
          cache-from: type=gha,scope=platform
          cache-to: type=gha,scope=platform,mode=max
